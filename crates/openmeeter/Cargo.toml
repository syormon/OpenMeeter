[package]
name = "openmeeter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
eframe = "0.36.2"
env_logger = "0.11.11"
global-hotkey = "0.8"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
openmeeter-backend = { version = "0.1.0", path = "../backend" }
rfd = "0.17.2"
rubato = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tray-icon = "0.25.1"

[target."cfg(windows)".dependencies]
openmeeter-windows = { version = "0.1.0", path = "../backend-windows" }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }
winreg = "0.56.0"

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3", features = ["termination"] }
gtk = "0.18"
winit = { version = "0.30", default-features = false, features = ["x11"] }
openmeeter-pipewire = { version = "0.1.0", path = "../backend-pipewire" }

[target.'cfg(not(any(windows, target_os = "linux", target_os = "macos")))'.dependencies]
eframe = { version = "0.36.2", features = ["glow"] }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
winresource = "0.1.31"
