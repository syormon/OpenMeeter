name: Release

on:
  push:
    branches: [main, master]
    paths: [Cargo.toml]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Compare [workspace.package] version with the previous push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version_at() {
            python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])'
          }
          current=$(version_at < Cargo.toml)
          # A new branch has no "before" commit (all zeros); treat that as a change.
          previous=""
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE:Cargo.toml" 2>/dev/null; then
            previous=$(git show "$BEFORE:Cargo.toml" | version_at || true)
          fi
          echo "version: '$previous' -> '$current'"

          release=false
          if [[ "$current" == "$previous" ]]; then
            echo "Version unchanged; not releasing."
          elif git ls-remote --exit-code --tags origin "refs/tags/v$current" >/dev/null; then
            echo "Tag v$current already exists; not releasing again."
          else
            release=true
          fi
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p openmeeter

      - name: Test
        run: cargo test --release --locked --workspace

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/openmeeter.exe "dist/openmeeter-${{ needs.version.outputs.version }}-windows-x86_64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Build Linux
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libpulse-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p openmeeter

      - name: Test
        run: cargo test --release --locked --workspace

      - name: Package
        run: |
          name="openmeeter-${{ needs.version.outputs.version }}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/openmeeter "dist/$name/"
          strip "dist/$name/openmeeter"
          cp README.md images/icon.png "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenMeeter $VERSION" \
            --generate-notes
